services:
  chaospay:
    build: .
    container_name: chaospay
    ports:
      - "48532:8532"
    environment:
      # Глобальная задержка ответов (в секундах) для имитации тормозов банка.
      - CHAOSPAY_DELAY_SECONDS=${CHAOSPAY_DELAY_SECONDS:-0}

      # ----- QR-PAY -----
      - PG_WEBHOOK_URL=${PG_WEBHOOK_URL:-http://payment-gateway-go-nginx:80/api/v1/payment-gateway/webhook/freedom-qr}

      # ----- Freedom Pay (карточные) -----
      # Webhook PG для оплат
      - PG_FREEDOM_PAY_WEBHOOK_URL=${PG_FREEDOM_PAY_WEBHOOK_URL:-http://payment-gateway-go-nginx:80/api/v1/payment-gateway/webhook/freedompay}
      # Webhook PG для bind-карты
      - PG_FREEDOM_PAY_CARD_WEBHOOK_URL=${PG_FREEDOM_PAY_CARD_WEBHOOK_URL:-http://payment-gateway-go-nginx:80/api/v1/payment-gateway/webhook/freedompay/card}
      # Эти значения должны совпадать с теми, что прописаны в БД PG для тестового Freedom-терминала.
      - CHAOSPAY_FREEDOM_MERCHANT_ID=${CHAOSPAY_FREEDOM_MERCHANT_ID:-100001}
      - CHAOSPAY_FREEDOM_SECRET=${CHAOSPAY_FREEDOM_SECRET:-mock-secret-key}
      - CHAOSPAY_FREEDOM_TERMINAL_ID=${CHAOSPAY_FREEDOM_TERMINAL_ID:-1}
      # Если true — мок автоматически шлёт webhook на каждый переход в Authorized/Captured/...
      # По умолчанию false — webhook отправляется кнопкой Send Webhook из панели.
      - CHAOSPAY_FREEDOM_AUTO_WEBHOOK=${CHAOSPAY_FREEDOM_AUTO_WEBHOOK:-false}
      # URL hosted-формы (используется для редиректа после init_payment.php). В моке — наша же панель.
      - CHAOSPAY_FREEDOM_HOSTED_URL=${CHAOSPAY_FREEDOM_HOSTED_URL:-http://localhost:48532/panel?tab=cards}

      # ----- Halyk Epay v2 -----
      # OAuth client (любая из тестовых пар Halyk: test/test1/test2/test3).
      - CHAOSPAY_EPAY_CLIENT_ID=${CHAOSPAY_EPAY_CLIENT_ID:-test}
      - CHAOSPAY_EPAY_CLIENT_SECRET=${CHAOSPAY_EPAY_CLIENT_SECRET:-yF587AV9Ms94qN2QShFzVR3vFnWkhjbAK3sG}
      # UUID терминала (должен совпадать с конфигом терминала Epay v2 в БД PG).
      - CHAOSPAY_EPAY_TERMINAL_UUID=${CHAOSPAY_EPAY_TERMINAL_UUID:-67e34d63-102f-4bd1-898e-370781d0074d}
      # Postlink URLs PG. По умолчанию — пути из real PG epay-v2 webhook controller.
      - PG_EPAY_POSTLINK_URL=${PG_EPAY_POSTLINK_URL:-http://payment-gateway-go-nginx:80/api/v1/payment-gateway/webhook/epay_v2/postlink}
      - PG_EPAY_FAILURE_POSTLINK_URL=${PG_EPAY_FAILURE_POSTLINK_URL:-http://payment-gateway-go-nginx:80/api/v1/payment-gateway/webhook/epay_v2/failure_postlink}
      - PG_EPAY_BIND_POSTLINK_URL=${PG_EPAY_BIND_POSTLINK_URL:-http://payment-gateway-go-nginx:80/api/v1/payment-gateway/webhook/epay/postlink/bind}
      # Если true — мок автоматически шлёт postlink после успешного charge/cancel/refund.
      - CHAOSPAY_EPAY_AUTO_WEBHOOK=${CHAOSPAY_EPAY_AUTO_WEBHOOK:-false}
      # Страница проверки 3DS. У Halyk в secure3D.action приходит внешний адрес ACS эмитента,
      # поэтому для локального прогона мок подставляет свою — иначе цикл не замыкается.
      - CHAOSPAY_EPAY_ACS_URL=${CHAOSPAY_EPAY_ACS_URL:-http://chaospay:8532/epay/3ds/acs}

      # ----- Flitt -----
      # Тестовый merchant из docs.flitt.com/api/testing/ — мок принимает любую подпись,
      # но при отправке callback-а на PG использует этот secret для SHA1.
      - CHAOSPAY_FLITT_MERCHANT_ID=${CHAOSPAY_FLITT_MERCHANT_ID:-1549901}
      - CHAOSPAY_FLITT_SECRET=${CHAOSPAY_FLITT_SECRET:-test}
      # Webhook PG для платежей и привязки карт.
      - PG_FLITT_WEBHOOK_URL=${PG_FLITT_WEBHOOK_URL:-http://payment-gateway-go-nginx:80/api/v1/payment-gateway/webhook/flitt}
      - PG_FLITT_BIND_WEBHOOK_URL=${PG_FLITT_BIND_WEBHOOK_URL:-http://payment-gateway-go-nginx:80/api/v1/payment-gateway/webhook/flitt/bind}
      # URL hosted-формы (возвращается в checkout_url). В моке — наша же панель.
      - CHAOSPAY_FLITT_HOSTED_URL=${CHAOSPAY_FLITT_HOSTED_URL:-http://localhost:48532/panel?bank=flitt&tab=cards}
      # Авто-callback после approved-сценариев. По умолчанию on — иначе тесты PG не получат callback.
      - CHAOSPAY_FLITT_AUTO_WEBHOOK=${CHAOSPAY_FLITT_AUTO_WEBHOOK:-true}

      # ----- Freedom Loyalty (mock /loyaltyservice/loyalty/frhcCompanyTransaction) -----
      # Процент кешбека: cashbackAmount = amount * percent / 100.
      - CHAOSPAY_LOYALTY_CASHBACK_PERCENT=${CHAOSPAY_LOYALTY_CASHBACK_PERCENT:-10}
      # Фиксированный остаток баланса клиента во Freedom, который мок возвращает в ответе.
      - CHAOSPAY_LOYALTY_CASHBACK_BALANCE=${CHAOSPAY_LOYALTY_CASHBACK_BALANCE:-10000}
    networks:
      - freedom-network

networks:
  freedom-network:
    external: true
    name: dockernet-local
