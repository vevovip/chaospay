name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run linter
        # Версия golangci-lint пинится в go.mod через tool directive — используем её,
        # чтобы локально и в CI был один и тот же binary.
        run: make lint

  unit-tests:
    name: Unit tests (go test -race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run unit tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  integration-tests:
    name: Integration tests (79 scenarios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Create docker network
        # docker-compose.yml ссылается на external network 'dockernet-local'.
        # В CI её нет — создаём пустую, чтобы compose поднялся.
        run: docker network create dockernet-local

      - name: Build and start ChaosPay
        run: |
          docker compose build
          docker compose up -d

      - name: Wait for /health
        run: |
          for i in {1..30}; do
            if curl -sS -m 2 http://localhost:48532/health; then
              echo " ← container ready"
              exit 0
            fi
            sleep 1
          done
          echo "ChaosPay не поднялся за 30 секунд"
          docker logs chaospay || true
          exit 1

      - name: Run integration tests
        run: make test-integration

      - name: Docker logs on failure
        if: failure()
        run: docker logs chaospay || true
